name: test
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fd-find ripgrep
      - if: runner.os == 'macOS'
        run: brew install fd ripgrep
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -o bin/lazyfind .
      - run: python3 scripts/pty_smoke.py bin/lazyfind
